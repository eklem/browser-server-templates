<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./img/icon-192x192.png">
    <link rel="manifest" href="./manifest.json" crossorigin="use-credentials" />
    <link rel="stylesheet" href="./styles.css">
    <title>Webpage server - Calculator example</title>
  </head>
  <body>
    <h1>JavaScript webpage server example</h1>
    <input type="number" size="10" value="0" id="num1">
    <select name="calculation" id="arithmeticSymbol">
        <option value="add">+ added to</option>
        <option value="subtract">- subtracted by</option>
        <option value="multiply">* multiplied by</option>
        <option value="divide">/ divide by</option>
    </select>
    <input type="number" size="10" value="0" id="num2">
    <button id="calculate">Calculate!</button>
    <h2>Result</h2>
    <div id="result">
      <p>[no results so far]</p>
    </div>
    <h2>All math problems done so far</h2>
    <div id="history">
      <p>[no history]</p>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
